name: Debug OIDC

# Temporary. Prints the OIDC token's claims so the trust policy can be matched against
# what GitHub actually presents, rather than what it is assumed to present.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Decode OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref}'
