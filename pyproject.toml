[project]
name = "voice-billing-agent"
version = "0.1.0"
description = "Multilingual voice agent for inbound invoice, payment, credit and billing-dispute calls"
# Pinned to the Lambda runtime, not merely a floor: the deployment package must be built
# against the version that will execute it.
requires-python = ">=3.12,<3.13"

# boto3 is provided by the Lambda runtime and is deliberately not pinned here, so the
# deployment package stays small. httpx is vendored because HubSpot is the only external
# HTTP dependency.
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "moto[dynamodb,s3]>=5.0",
    "boto3>=1.34",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored Spec Kit tooling. Not ours to reformat.
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure domain logic, no AWS",
    "contract: handler request/response shapes against specs/*/contracts/",
    "integration: runs against deployed endpoints",
]
addopts = "--strict-markers"
